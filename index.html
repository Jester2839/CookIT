<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookIT – Chytrý pomocník v kuchyni</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="img/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <header class="app-header">
        <div class="header-logo">
            <img src="img/icon.png" alt="CookIT Logo">
            <h1>CookIT</h1>
        </div>
        <span class="badge-offline" id="offlineIndicator" style="display: none;">Offline režim</span>
    </header>

    <main class="app-content">
        
        <section id="search-section" class="tab-content active">
            <div class="search-container">
                <div class="search-header">
                    <div class="search-header-row">
                        <label>Moje ingredience</label>
                        <button id="btn-add-ingredient" class="btn-add-circle" title="Přidat surovinu">
                            <i class="ph ph-plus"></i>
                        </button>
                    </div>
                    <p>Vyberte suroviny, které chcete použít k vaření.</p>
                </div>
                
                <div id="tags-container" class="ingredients-tags">
                    <!-- Dynamický obsah přes JS -->
                </div>
                <button id="btn-search" class="btn-primary">
                    <i class="ph ph-cooking-pot"></i>
                    Najít recepty
                </button>
            </div>

            <div id="recipes-grid" class="recipes-grid">
            </div>
        </section>

        <section id="favorites-section" class="tab-content">
            <h2>Moje oblíbené recepty</h2>
            <div id="favorites-grid" class="recipes-grid">
                </div>
        </section>

        <section id="shopping-section" class="tab-content">
            <h2>Nákupní seznam</h2>
            <ul id="shopping-list" class="shopping-list">
                </ul>
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" data-target="search-section">
            <i class="ph ph-magnifying-glass nav-icon"></i>
            <span class="nav-label">Hledat</span>
        </button>
        <button class="nav-item" data-target="favorites-section">
            <i class="ph ph-heart nav-icon"></i>
            <span class="nav-label">Oblíbené</span>
        </button>
        <button class="nav-item" data-target="shopping-section">
            <i class="ph ph-shopping-cart nav-icon"></i>
            <span class="nav-label">Nákup</span>
        </button>
    </nav>

    <!-- Modal pro výběr ingrediencí -->
    <div id="ingredient-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Přidat surovinu</h2>
                <button id="btn-close-modal" class="btn-close">
                    <i class="ph ph-x"></i>
                </button>
            </div>
            <input type="text" id="modal-search" placeholder="Vyhledat surovinu...">
            <ul id="modal-ingredient-list" class="modal-list">
                <!-- Zde se vygenerují položky přes JS -->
            </ul>
        </div>
    </div>

    <!-- Modal pro detail receptu -->
    <div id="recipe-detail-modal" class="modal">
        <div class="modal-content detail-content">
            <div class="modal-header">
                <button id="btn-close-detail" class="btn-close">
                    <i class="ph ph-arrow-left"></i>
                </button>
                <h2 id="detail-title">Načítání...</h2>
                <button id="detail-fav-btn" class="btn-icon-outline">
                    <i class="ph ph-heart"></i>
                </button>
            </div>
            <div class="detail-body">
                <img id="detail-img" src="" alt="" class="detail-hero-img">
                
                <div class="detail-section">
                    <h3>Nutriční hodnoty</h3>
                    <div id="detail-nutrition" class="nutrition-grid">
                        <!-- Zde se vygenerují živiny -->
                    </div>
                </div>

                <div class="detail-section">
                    <h3>Ingredience</h3>
                    <ul id="detail-ingredients" class="detail-list"></ul>
                </div>

                <div class="detail-section">
                    <h3>Postup přípravy</h3>
                    <div id="detail-instructions" class="instructions-text"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
